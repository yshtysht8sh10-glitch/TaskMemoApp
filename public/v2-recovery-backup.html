<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="taskmemo-commit" content="__TASKMEMO_DIAGNOSTIC_COMMIT__">
  <title>TaskMemo V2復旧バックアップ</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: max(20px, env(safe-area-inset-top)) 16px 24px; color: #1b2734; background: #f4f7fb; }
    main { max-width: 800px; margin: auto; }
    p { line-height: 1.6; }
    button { display: block; width: 100%; min-height: 48px; margin: 12px 0; font-size: 16px; border: 1px solid #48627a; border-radius: 8px; background: white; color: #1b2734; }
    button:disabled { opacity: .5; }
    #status { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
  <script defer src="/v2-recovery-backup.js?build=__TASKMEMO_DIAGNOSTIC_COMMIT__"></script>
</head>
<body>
  <main>
    <h1>V2復旧バックアップ</h1>
    <p>このページはTaskMemo本体・Firebase同期を起動せず、現在のPWAのTaskMemo localStorageを読み取るだけです。保存領域への書き込み・削除は行いません。</p>
    <p><strong>注意:</strong> バックアップファイルにはメモのタイトル・本文・常設メモ、outbox、Undo/Redo履歴などの個人データが含まれます。ChatGPT/Codexへ貼り付けず、端末の「ファイル」等の安全な場所へ保存してください。通常の「データを読み込む」では復元できない復旧用原本です。</p>
    <button id="prepare" type="button">バックアップを準備</button>
    <button id="share" type="button" disabled>ファイルへ共有・保存</button>
    <button id="download" type="button" disabled>ブラウザでダウンロード</button>
    <p id="status" role="status" aria-live="polite">未準備です。</p>
  </main>
</body>
</html>
