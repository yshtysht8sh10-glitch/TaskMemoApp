<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="taskmemo-version" content="__TASKMEMO_DIAGNOSTIC_VERSION__">
  <meta name="taskmemo-commit" content="__TASKMEMO_DIAGNOSTIC_COMMIT__">
  <title>TaskMemo localStorage診断</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: max(20px, env(safe-area-inset-top)) 16px 24px; color: #1b2734; background: #f4f7fb; }
    main { max-width: 800px; margin: auto; }
    h1 { font-size: 1.35rem; }
    p { line-height: 1.6; }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    button { min-height: 44px; font-size: 16px; border: 1px solid #48627a; border-radius: 8px; padding: 8px 12px; background: white; color: #1b2734; }
    #result { display: block; width: 100%; min-height: 340px; box-sizing: border-box; font-size: 13px; line-height: 1.5; resize: vertical; }
    #status { min-height: 24px; }
  </style>
  <script defer src="/storage-diagnostics.js?build=__TASKMEMO_DIAGNOSTIC_COMMIT__"></script>
</head>
<body>
  <main>
    <h1>TaskMemo localStorage診断</h1>
    <p>このページはTaskMemo本体を起動しません。保存領域の読み取り結果をこの画面だけに表示します。診断結果にメモ内容、メールアドレス、認証情報、アカウント識別子は含めません。</p>
    <p><a href="/v2-recovery-backup?build=__TASKMEMO_DIAGNOSTIC_COMMIT__">V2復旧用の完全バックアップを作成する</a>（個人データを含むファイルとして保存）</p>
    <p>照合の比較: <a href="/?receiptMode=parallel">8件並列</a> / <a href="/?receiptMode=serial">直列（間隔なし）</a> / <a href="/?receiptMode=serial-interval-100">直列（各read後100ms間隔・診断実験）</a>。TaskMemo本体を前面に表示して待ち、その後に設定からこの診断ページへ戻ってください。いずれも読み取り専用の安全停止モードです。</p>
    <div class="buttons">
      <button id="measure" type="button">診断を実行</button>
      <button id="copy" type="button">診断結果をコピー</button>
    </div>
    <p id="status" role="status" aria-live="polite">未測定です。</p>
    <textarea id="result" aria-label="診断結果" readonly></textarea>
  </main>
</body>
</html>
